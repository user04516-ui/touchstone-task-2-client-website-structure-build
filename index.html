<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North Star Bakery</title>
</head>
<body>
    
    <header>
        <h1>North Star Bakery</h1>
        <p>Welcome to North Star Bakery</p>
    </header>
        
    <nav aria-label="Primary">
        <ul>
            <li><a href="index.html" aria-current="page">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>

    </nav><!--navagation links for a multipage website-->
<main>

    <audio
        src="media/bakery-welcome_c.mp3"
        controls>
        Your browser cannot play this audio.
    </audio><br><!-- this line adds any sound files-->

    <figure> 
            <img src="images/bakery-storefront_c.png"
                alt="The Storefront of our bakery"
                width="902"       
                height="537">
            <figcaption>The Storefront of our bakery.
            </figcaption>    
    </figure><!--this adds text to image and an accessibility description-->

    <h2>Place an Order</h2>

    <form action="/order" method="post">
        <fieldset>
            <legend>Select your favorites</legend>

            <label>
                <input type="checkbox" name="donuts" value="donuts">Swirl Donuts
            </label>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="50"><br>

            <label>
                <input type="checkbox" name="donuts" value="donuts">Fresh Coffee
            </label>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="50"><br>

            <label>
                <input type="checkbox" name="donuts" value="donuts">Raisin Bread
            </label>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="50"><br>

            <label>
                <input type="checkbox" name="donuts" value="donuts">Twist Bread
            </label>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="50"><br>

            <label>
                <input type="checkbox" name="donuts" value="donuts">4 Assorted Cookies
            </label>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="50"><br>

            <label>
                <input type="checkbox" name="donuts" value="donuts">Perfect Baguettes
            </label>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="50"><br>


        </fieldset>

        <fieldset>
            <legend>Payment Information</legend>

            <label for="text">Full Name:</label>
            <input type="text" id="text">
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
             <br><br>   
            <button type="submit">Checkout</button>

        </fieldset>


    </form>
    
    
    

</main>

<footer>
   
     <img src="images/bakery-logo_c.png"
        alt="North Star Bakery"
        width="374"
        height="319"><br><!--this adds a picture-->

    <p>&copy; 2026 North Star Bakery</p>
</footer>
